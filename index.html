    }

    function renderCapture() {
      const stage = $("#stage");

      if (!state.tipo) {
        // el selector son los tipos de prenda del extracto, agrupados como vienen en él
        const porGrupo = {};
        const hits = tiposFiltrados();
        hits.forEach(function (x) { (porGrupo[x.grupo] = porGrupo[x.grupo] || []).push(x); });
        const grupos = Object.keys(porGrupo).sort(function (a, b) {
          return porGrupo[b].reduce(function (s, x) { return s + x.n; }, 0) -
            porGrupo[a].reduce(function (s, x) { return s + x.n; }, 0);
        });

        stage.innerHTML =
          '<div class="stage-head"><div>' +
          '<span class="eyebrow">Paso 1 de 2</span>' +
          '<p>Los <b>' + tiposVivos().length + ' tipos de prenda</b> que se usan en el sistema, con las referencias que se ' +
          'crearon desde 2025.  ' +
          '<p class="field-hint" style="margin:6px 0 0">El tipo de prenda se ubica en ' +
          '<span class="mono">referencias_Subgru2</span>. Del mismo bloque de tablas salen la marca ' +
          '(<span class="mono">referencias_gru</span>), el género (<span class="mono">referencias_Subgru</span>) ' +
          'el material (<span class="mono">referencias_Subgru3</span>) y el color ' +
          '(<span class="mono">referencias_cla</span>).</p>' +
          cajaBuscar("paso1", "Buscar tipo de prenda: jean, tenis, calzado…") +
          (state.buscarTipo
            ? '<p class="field-hint" style="margin:8px 0 0">' + hits.length + ' de ' +
              tiposVivos().length + ' coinciden con «' + esc(state.buscarTipo) + '».</p>'
            : "") +
          '</div></div>' +
          // los que se dieron de baja: se pueden devolver al catálogo
          (edicionDe(GEN).tipos.length
            ? '<section class="card group edicion"><div class="group-head">' +
            '<h2>Dados de baja del catálogo</h2><span class="n">' + edicionDe(GEN).tipos.length +
            '</span></div><div class="pad">' +
            '<p class="field-hint" style="margin:0 0 10px">Ya no aparecen para crear producto. ' +
            'Haz clic para devolverlos.</p><div class="chips">' +
            edicionDe(GEN).tipos.map(function (t) {
              return '<button type="button" class="chip fuera" data-resttipo="' + esc(t) + '">' +
                esc(t) + '<span class="x">↺</span></button>';
            }).join("") + '</div></div></section>'
            : "") +
          grupos.map(function (g) {
            return '<section class="card group"><div class="group-head"><h2>' + esc(g) + '</h2>' +
              '<span class="n">' + porGrupo[g].length + '</span></div><div class="pad">' +
              '<div class="cat-grid">' + porGrupo[g].map(function (x) {
                const c = catById(x.cat);
                const n = nCambios(x.t);
                return '<button type="button" class="cat-tile" data-tipo="' + esc(x.t) + '">' +
                  '<span class="t">' + esc(x.t) +
                  (n ? ' <span class="pill thr">' + n + ' editado' + (n > 1 ? "s" : "") + '</span>' : "") +
                  '</span>' +
                  '<span class="d">' + NUM(x.n) + (x.n === 1 ? ' referencia' : ' referencias') + ' desde 2025</span>' +
                  '<span class="legacy">' + (c
                    ? '<b>' + bindingsTipo(x.t, c).length + ' campos</b> · contrato de ' + esc(c.label)
                    : '<b>Sin formulario asignado</b>') + '</span></button>';
              }).join("") + '</div></div></section>';
          }).join("") +
          mapaDeCampos();
        return;
      }

      const tipo = tipoByName(state.tipo);
      const cat = catById(state.cat);

      // red de seguridad: hoy los 62 tipos tienen contrato, pero si se agrega uno
      // nuevo al extracto y todavía no se le define, la pantalla lo dice.
      if (!cat) {
        stage.innerHTML =
          '<div class="stage-head"><div style="flex:1;min-width:240px">' +
          '<span class="eyebrow">' + esc(tipo.grupo) + '</span><h1>' + esc(tipo.t) + '</h1>' +
          '<p>' + NUM(tipo.n) + ' referencias creadas desde 2025.</p></div></div>' +
          '<section class="card group"><div class="group-head"><h2>Falta definir sus campos</h2>' +
          '</div><div class="pad"><p style="margin:0;color:var(--ink-2);max-width:74ch">' +
          'A <span class="mono">' + esc(tipo.t) + '</span> todavía no se le asignó un juego de campos. ' +
          'Se define una vez y queda disponible para todas sus referencias.</p></div></section>';
        return;
      }

      const vis = visibleBindings();
      const st = requiredStats();
      const hermanos = cat.fromTipos.filter(function (x) { return x.t !== tipo.t; });

      let html = '<div class="stage-head"><div style="flex:1;min-width:240px">' +
        '<span class="eyebrow">' + esc(tipo.grupo) + ' · ' + NUM(tipo.n) + ' refs desde 2025</span>' +
        '<h1>' + esc(tipo.t) + '</h1>' +
        '<p>Se muestran <b>' + vis.length + '</b> atributos de los ' + totalAttrsInRegistry() +
        ' del catálogo; el resto no aplica y por eso no existe en pantalla.</p>' +
        '<p class="field-hint" style="margin:0">Estos campos son el contrato de <b>' + esc(cat.label) + '</b>' +
        (hermanos.length
          ? ', el mismo que piden ' + esc(hermanos.map(function (x) { return x.t; }).join(", ")) +
          '. Por eso son una sola categoría y no ' + (hermanos.length + 1) + ' formularios distintos.'
          : '. Ningún otro tipo de prenda del extracto pide este juego de campos.') + '</p>' +
        // cada característica queda en un solo lado: o tipo, o Apariencia
        '<div class="leyenda"><span><span class="src-tag c-tipo">tipo_N</span>ocupa ese campo de tipo</span>' +
        '<span><span class="src-tag c-apar">Apariencia</span>se guarda como etiqueta de Apariencia</span>' +
        '<span><span class="src-tag c-tabla">referencias_…</span>tiene tabla propia</span>' +
        '<span style="color:var(--ink-3)">El campo es el mismo en todas las prendas. Pasa el mouse por la ' +
        'etiqueta para ver por qué le tocó ese.</span>' +
        '</div></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        (st.missing.length
          ? '<span class="pill req">' + st.missing.length + ' requerido' + (st.missing.length > 1 ? "s" : "") + ' sin llenar</span>'
          : '<span class="pill ok">Requeridos completos</span>') +
        '<span class="pill mut">' + vis.filter(isMulti).length + ' de selección múltiple</span>' +
        '<button type="button" class="btn' + (state.editar ? " thread" : "") + '" data-editar="1">' +
        (state.editar ? "Salir de depuración" : "Depurar campos") + '</button>' +
        '</div></div>';

      if (state.editar) html += barraEdicion(tipo, vis);

      GROUPS.forEach(function (g) {
        const inG = vis.filter(function (b) { return ATTRS[b.code].g === g[0]; });
        if (!inG.length) return;
        html += '<section class="card group" id="g-' + g[0] + '">' +
          '<div class="group-head"><h2>' + esc(g[1]) + '</h2><span class="n">' + inG.length + '</span></div>' +
          '<div class="group-body">';

        inG.forEach(function (b) {
          const at = ATTRS[b.code];
          const dep = !!at.showIf;
          const sel = Array.isArray(state.values[b.code]) ? state.values[b.code].length : 0;
          html += '<div class="field' + (dep ? " dep" : "") + (b.extra ? " extra" : "") + '">' +
            '<div class="field-head">' +
            '<label>' + esc(at.label) + (b.req ? ' <span class="star" title="Requerido">*</span>' : "") + '</label>' +
            '<span class="code">' + esc(b.code) + '</span>' +
            (b.extra ? '<span class="pill thr">agregado</span>' : "") +
            (at.input === "auto" ? '<span class="pill auto">automático</span>' : "") +
            (at.def ? '<span class="pill auto">por defecto</span>' : "") +
            (isMulti(b) ? '<span class="pill mut">múltiple' + (b.max ? " · máx " + b.max : "") +
              (sel ? " · " + sel + " sel." : "") + '</span>' : "") +
            (dep ? '<span class="pill acc">dependiente</span>' : "") +
            // en qué campo se queda; en depuración se puede cambiar
            (state.editar ? selectorCampo(b.code) : campoTag(b.code)) +
            (state.editar ? '<button type="button" class="btn quitar" data-quitar="' + b.code +
              '" title="Quitar este campo de ' + esc(tipo.t) + '">Quitar</button>' : "") +
            '</div>' +
            (at.help ? '<p class="field-hint">' + esc(at.help) + '</p>' : "") +
            fieldControl(b) +
            (state.editar ? stripValores(b.code) : "") +
            '</div>';
        });
        html += '</div></section>';
      });

      if (state.editar) html += panelAgregar(tipo, vis);

      stage.innerHTML = html;
    }

    /* -------------------------------------------------------------------------
       Depuración: barra de estado, valores del campo y panel para agregar.
       ------------------------------------------------------------------------- */

    // en depuración, la etiqueta del campo se vuelve un selector
    function selectorCampo(code) {
      const c = campoDe(code);
      if (!c) return "";
      const movido = campoCambiado(code);
      return '<span class="sel-campo' + (movido ? " cambiado" : "") + '">' +
        '<select data-campo="' + code + '" title="Cambiar el campo donde se guarda esta característica ' +
        '(aplica a todas las prendas)">' +
        DESTINOS.map(function (d) {
          return '<option value="' + d + '"' + (d === c[0] ? " selected" : "") + '>' + esc(d) + '</option>';
        }).join("") + '</select>' +
        (movido ? '<button type="button" class="btn" data-restcampo="' + code +
          '" title="Volver a lo calculado: ' + esc(CAMPO[code][0]) + '">↺</button>' : "") +
        '</span>';
    }

    // debajo de cada campo, sus valores con una × para darlos de baja
    function stripValores(code) {
      const at = ATTRS[code];
      if (!at || !at.values) return "";
      const vivos = activeValues(code, state.cat);
      const fuera = valoresQuitados(code, state.tipo);
      if (!vivos.length && !fuera.length) return "";
      return '<div class="valores"><span class="eyebrow">' + vivos.length + ' valor' +
        (vivos.length === 1 ? "" : "es") + ' en uso · quita los que no apliquen ' +
        (state.alcance === "general" ? "en ninguna prenda" : "a " + esc(state.tipo)) + '</span>' +
        '<div class="chips">' +
        vivos.map(function (v) {
          return '<button type="button" class="chip vq" data-quitarval="' + code + '::' + v.id + '" ' +
            'title="Dar de baja este valor">' + esc(v.l) + '<span class="x">×</span></button>';
        }).join("") +
        fuera.map(function (v) {
          return '<button type="button" class="chip fuera" data-restval="' + code + '::' + v.id + '" ' +
            'title="Restaurar · dado de baja ' + (v.alcance === "general" ? "en todas las prendas" :
              "en esta prenda") + '">' + esc(v.l) + '<span class="x">↺</span></button>';
        }).join("") +
        '</div></div>';
    }

    // lista de cambios de un alcance, con clic para deshacer
    function listaCambios(clave, titulo) {
      const ed = edicionDe(clave);
      const nVal = Object.keys(ed.valores).reduce(function (s, c) { return s + ed.valores[c].length; }, 0);
      const nCam = Object.keys(ed.campos).length;
      if (!ed.quitar.length && !ed.agregar.length && !nVal && !ed.tipos.length && !nCam) return "";
      const campo = function (code, quitado) {
        return '<button type="button" class="chip" data-' + (quitado ? "agregar" : "quitar") + '="' +
          code + '" title="Deshacer">' + esc(ATTRS[code] ? ATTRS[code].label : code) +
          '<span class="x">×</span></button>';
      };
      return '<div class="cambios"><span class="eyebrow" style="width:100%">' + titulo + '</span>' +
        (ed.quitar.length ? '<div><span class="cd">Campos quitados</span><div class="chips">' +
          ed.quitar.map(function (c) { return campo(c, true); }).join("") + '</div></div>' : "") +
        (ed.agregar.length ? '<div><span class="cd">Campos agregados</span><div class="chips">' +
          ed.agregar.map(function (c) { return campo(c, false); }).join("") + '</div></div>' : "") +
        (nVal ? '<div><span class="cd">Valores dados de baja</span><div class="chips">' +
          Object.keys(ed.valores).map(function (c) {
            return ed.valores[c].map(function (id) {
              return '<button type="button" class="chip" data-restval="' + c + '::' + id + '" ' +
                'title="Restaurar">' + esc(labelOf(c, id)) + ' <span class="cd">· ' +
                esc(ATTRS[c] ? ATTRS[c].label : c) + '</span><span class="x">×</span></button>';
            }).join("");
          }).join("") + '</div></div>' : "") +
        (ed.tipos.length ? '<div><span class="cd">Tipos de prenda dados de baja</span><div class="chips">' +
          ed.tipos.map(function (t) {
            return '<button type="button" class="chip" data-resttipo="' + esc(t) + '" ' +
              'title="Devolver al catálogo">' + esc(t) + '<span class="x">×</span></button>';
          }).join("") + '</div></div>' : "") +
        (nCam ? '<div><span class="cd">Campos reasignados</span><div class="chips">' +
          Object.keys(ed.campos).map(function (c) {
            return '<button type="button" class="chip" data-restcampo="' + c + '" title="Volver a lo calculado">' +
              esc(ATTRS[c] ? ATTRS[c].label : c) + ' <span class="cd">· ' + esc(CAMPO[c][0]) + ' → ' +
              esc(ed.campos[c]) + '</span><span class="x">×</span></button>';
          }).join("") + '</div></div>' : "") +
        '</div>';
    }

    function barraEdicion(tipo, vis) {
      const conf = conflictosDe(vis);
      const total = totalCambios();
      const alc = function (k, l, d) {
        return '<button type="button" class="ord" data-alcance="' + k + '" aria-pressed="' +
          (state.alcance === k) + '" title="' + d + '">' + l + '</button>';
      };

      return '<section class="card group edicion"><div class="group-head">' +
        '<h2>Depurando <b>' + esc(tipo.t) + '</b></h2>' +
        '<span class="n">' + nCambios(tipo.t) + ' en esta prenda · ' + nCambios(GEN) +
        ' generales · ' + total + ' en total</span></div><div class="pad">' +

        '<div class="alcance"><span class="eyebrow">Lo que quites se aplica a</span>' +
        '<div class="ord-group">' +
        alc("prenda", "Solo " + esc(tipo.t), "El cambio afecta únicamente a este tipo de prenda") +
        alc("general", "Todas las prendas", "El cambio afecta a los 62 tipos de prenda") +
        '</div>' +
        '<button type="button" class="btn quitar" data-quitartipo="' + esc(tipo.t) + '" ' +
        'title="Sacar este tipo de prenda del catálogo">Dar de baja ' + esc(tipo.t) + '</button>' +
        '</div>' +

        listaCambios(tipo.t, "Cambios de " + esc(tipo.t)) +
        listaCambios(GEN, "Cambios generales · afectan a todas las prendas") +

        (!nCambios(tipo.t) && !nCambios(GEN)
          ? '<p class="field-hint" style="margin:0 0 10px">Usa <b>Quitar</b> en cualquier campo, quita ' +
          'valores sueltos con la × de cada uno, o agrega campos desde la lista del final. Con el ' +
          'alcance en <b>Todas las prendas</b> el cambio vale para el catálogo entero.</p>'
          : "") +

        (conf.length
          ? '<div class="alerta"><b>Ojo: dos campos en la misma columna.</b> ' +
          conf.map(function (c) {
            return '<span class="mono">' + esc(c.campo) + '</span> tendría que guardar ' +
              esc(c.campos.join(" y ")) + ' al tiempo, y solo cabe un valor.';
          }).join(" ") + ' Uno de los dos tendría que ir a Apariencia.</div>'
          : "") +

        '<div class="guardar">' +
        (state.servidor
          ? '<button type="button" class="btn primary" data-guardar="1"' + (state.sucio ? "" : " disabled") + '>' +
          (state.sucio ? "Guardar en el archivo" : "Sin cambios por guardar") + '</button>' +
          (nCambios(tipo.t) ? '<button type="button" class="btn" data-restablecer="' + esc(tipo.t) +
            '">Restablecer esta prenda</button>' : "") +
          (nCambios(GEN) ? '<button type="button" class="btn" data-restablecer="' + GEN +
            '">Restablecer lo general</button>' : "") +
          '<span class="cd">Se escribe en <span class="mono">ficha-producto.html</span>; queda una copia ' +
          'intacta en <span class="mono">ficha-producto.original.html</span>.</span>'
          : '<span class="cd" style="color:var(--crit)"><b>Modo solo lectura.</b> Puedes probar los cambios, ' +
          'pero para guardarlos en el archivo hay que abrir la ficha desde el servidor: ' +
          '<span class="mono">python3 servidor.py</span> y entrar a ' +
          '<span class="mono">http://localhost:8000/ficha-producto.html</span></span>') +
        (state.aviso ? '<span class="cd" style="color:var(--ok)">' + esc(state.aviso) + '</span>' : "") +
        '</div></div></section>';
    }

    function panelAgregar(tipo, vis) {
      const puestos = {};
      vis.forEach(function (b) { puestos[b.code] = 1; });
      const libres = Object.keys(ATTRS).filter(function (c) { return !puestos[c]; });
      if (!libres.length) return "";

      return '<section class="card group edicion"><div class="group-head">' +
        '<h2>Agregar campos a ' + esc(tipo.t) + '</h2>' +
        '<span class="n">' + libres.length + ' disponibles</span></div><div class="pad">' +
        '<p class="field-hint" style="margin:0 0 10px">Los ' + totalAttrsInRegistry() + ' atributos del ' +
        'catálogo que hoy no aparecen en esta ficha. Al agregar uno se muestra de inmediato, con la ' +
        'columna que le corresponde.</p>' +
        GROUPS.map(function (g) {
          const inG = libres.filter(function (c) { return ATTRS[c].g === g[0]; });
          if (!inG.length) return "";
          return '<div class="dept"><span class="eyebrow">' + esc(g[1]) + '</span><div class="chips">' +
            inG.map(function (c) {
              return '<button type="button" class="chip" data-agregar="' + c + '">' +
                esc(ATTRS[c].label) + ' <span class="mas">+</span></button>';
            }).join("") + '</div></div>';
        }).join("") +
        '</div></section>';
    }

    /* Guarda las ediciones llamando a servidor.py. */
    function guardarEdiciones() {
      state.aviso = "Guardando…";
      render();
      fetch("api/guardar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(EDICIONES)
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) throw new Error(d.error || "respuesta inesperada");
        state.sucio = false;
        state.aviso = "Guardado en ficha-producto.html · " + d.cambios + " cambio" +
          (d.cambios === 1 ? "" : "s");
        render();
      }).catch(function (e) {
        state.aviso = "No se pudo guardar: " + e.message;
        render();
      });
    }

    /* =========================================================================
       8. RENDER — INSPECTOR
       ========================================================================= */

    // Cuántos valores lleva diligenciada la ficha (un valor de selección
    // múltiple cuenta por cada opción marcada).
    function valoresCapturados() {
      let n = 0;
      visibleBindings().forEach(function (b) {
        const raw = state.values[b.code];
        if (raw === undefined || raw === null || raw === "") return;
        n += Array.isArray(raw) ? raw.length : 1;
      });
      return n;
    }

    function renderInspector() {
      const insp = $("#inspector");

      if (!state.cat) {
        insp.innerHTML = '<div class="insp-sec"><span class="eyebrow">Registro</span>' +
          '<p class="field-hint" style="margin:0">' + (state.tipo
            ? 'Este tipo de producto todavía no tiene formulario asignado.'
            : 'Elige un tipo de producto para ver los campos que hay que llenar.') + '</p></div>' +
          '<div class="insp-sec"><span class="eyebrow">Catálogo actual</span>' +
          '<div class="stat-row"><span>Tipos de prenda</span><b>' + tiposVivos().length + '</b></div>' +
          '<div class="stat-row"><span>Contratos distintos</span><b>' + CATS.length + '</b></div>' +
          '<div class="stat-row"><span>Atributos definidos</span><b>' + totalAttrsInRegistry() + '</b></div>' +
          '<div class="stat-row"><span>Grupos de campos</span><b>' + GROUPS.length + '</b></div></div>' +
          '<div class="insp-sec"><span class="eyebrow">De dónde sale cada campo hoy</span>' +
          SRC_TABLES.map(function (r) {
            return '<div class="stat-row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
          }).join("") + '</div>';
        return;
      }

      const st = requiredStats();
      const vis = visibleBindings();
      const pct = st.total ? Math.round(st.done / st.total * 100) : 100;
      const hidden = totalAttrsInRegistry() - vis.length;

      insp.innerHTML =
        '<div class="insp-sec"><span class="eyebrow">Completitud de requeridos</span>' +
        '<div class="meter"><i style="width:' + pct + '%" data-full="' + (pct === 100) + '"></i></div>' +
        '<div class="stat-row"><span>' + st.done + ' de ' + st.total + ' campos obligatorios</span><b>' + pct + '%</b></div>' +
        (st.missing.length
          ? '<p class="field-hint" style="margin:8px 0 0">Falta: ' +
          st.missing.map(function (b) { return esc(ATTRS[b.code].label); }).join(", ") + '.</p>'
          : '<p class="field-hint" style="margin:8px 0 0">Listo para guardar.</p>') +
        '</div>' +
        '<div class="insp-sec"><span class="eyebrow">Lo que ve el usuario</span>' +
        '<div class="stat-row"><span>Atributos en pantalla</span><b>' + vis.length + '</b></div>' +
        '<div class="stat-row"><span>Ocultos por no aplicar</span><b>' + hidden + '</b></div>' +
        '<div class="stat-row"><span>De selección múltiple</span><b>' + vis.filter(isMulti).length + '</b></div>' +
        '<div class="stat-row"><span>Valores capturados</span><b>' + valoresCapturados() + '</b></div>' +
        '</div>' +
        '<div class="insp-sec"><span class="eyebrow">Lo que el sistema llenó solo</span>' +
        '<div class="stat-row"><span>Colección (tipo_5)</span><b>' + esc(coleccionAuto()) + '</b></div>' +
        '<div class="stat-row"><span>Clase de producto (tipo_3)</span><b>' + esc(ATTRS.clase.def) + '</b></div>' +
        '<p class="field-hint" style="margin:8px 0 0">Dos campos menos que preguntar. La clase se puede cambiar; ' +
        'la colección la fija la fecha de creación.</p></div>' +
        (function () {
          const r = repartoCampos(vis);
          return '<div class="insp-sec"><span class="eyebrow">Dónde queda cada campo de esta ficha</span>' +
            '<div class="stat-row"><span>Ocupan un campo de tipo</span><b>' + r.tipo + '</b></div>' +
            '<div class="stat-row"><span>Se guardan en Apariencia</span><b>' + r.apar + '</b></div>' +
            '<div class="stat-row"><span>Tienen tabla propia</span><b>' + r.tabla + '</b></div>' +
            '<div class="stat-row"><span>Hay que sacarlas de algún campo</span><b>' + r.dup + '</b></div>' +
            '<p class="field-hint" style="margin:8px 0 0">El campo de cada característica es el mismo en ' +
            'todas las prendas. Dentro de una ficha, una columna de tipo nunca se repite: si dos ' +
            'características chocan, la que menos se usa pasa a Apariencia.</p></div>';
        })() +
        '<div class="insp-sec">' +
        '<button type="button" class="btn" data-reset="1">Vaciar formulario</button>' +
        '</div>';
    }


    /* =========================================================================
       9. RENDER RAÍZ + EVENTOS
       ========================================================================= */

    function render() {
      renderRail();
      renderCapture();
      renderInspector();
    }

    // limpia valores de atributos que dejaron de ser visibles
    function pruneHidden() {
      Object.keys(ATTRS).forEach(function (code) {
        if (ATTRS[code].showIf && !visible(code)) delete state.values[code];
      });
    }

    document.addEventListener("click", function (ev) {
      const t = ev.target.closest("button");
      // un clic fuera del desplegable lo cierra, pero no se traga la acción del botón
      if (!ev.target.closest(".combo") && state.comboOpen) {
        state.comboOpen = null; state.comboQuery = "";
        if (!t) { render(); return; }
      }
      if (!t) return;
      const d = t.dataset;

      // el usuario elige un tipo de prenda; la categoría solo presta el contrato
      if (d.tipo) {
        const x = tipoByName(d.tipo);
        state.tipo = x ? x.t : null;
        state.cat = x ? x.cat : null;
        state.values = {};
        applyDefaults();
        render();
        return;
      }

      if (d.single) {
        state.values[d.single] = state.values[d.single] === d.val ? undefined : d.val;
        if (state.values[d.single] === undefined) delete state.values[d.single];
        if (d.single === "marca") delete state.values.linea;   // las familias cambian con la marca
        pruneHidden(); render(); return;
      }

      if (d.multi) {
        const cur = Array.isArray(state.values[d.multi]) ? state.values[d.multi].slice() : [];
        const i = cur.indexOf(d.val);
        if (i === -1) cur.push(d.val); else cur.splice(i, 1);
        if (cur.length) state.values[d.multi] = cur; else delete state.values[d.multi];
        pruneHidden(); render(); return;
      }

      if (d.pick) {
        state.values[d.pick] = d.val;
        if (d.pick === "marca") delete state.values.linea;   // las familias cambian con la marca
        state.comboOpen = null; state.comboQuery = "";
        pruneHidden(); render(); return;
      }

      if (d.limpiarbusca) { state.buscarTipo = ""; render(); return; }
      if (d.reset) { state.values = {}; applyDefaults(); render(); return; }

      /* --- depuración de campos, valores y tipos de prenda --- */
      if (d.editar) { state.editar = !state.editar; state.aviso = ""; render(); return; }
      if (d.alcance) { state.alcance = d.alcance; render(); return; }
      if (d.quitar) { editarCampo(d.quitar, true); pruneHidden(); render(); return; }
      if (d.agregar) { editarCampo(d.agregar, false); render(); return; }
      if (d.quitarval || d.restval) {
        const p = (d.quitarval || d.restval).split("::");
        editarValor(p[0], p[1], !!d.quitarval);
        pruneHidden(); render(); return;
      }
      if (d.quitartipo) { editarTipo(d.quitartipo, true); render(); return; }
      if (d.resttipo) { editarTipo(d.resttipo, false); render(); return; }
      if (d.restcampo) { reasignarCampo(d.restcampo, null); render(); return; }
      if (d.restablecer) {
        delete EDICIONES[d.restablecer];
        state.sucio = true; state.aviso = "";
        pruneHidden(); render(); return;
      }
      if (d.guardar) { guardarEdiciones(); return; }
    });

    document.addEventListener("change", function (ev) {
      const d = ev.target.dataset;
      if (d.bool) { state.values[d.bool] = ev.target.checked; pruneHidden(); render(); return; }
      if (d.campo) { reasignarCampo(d.campo, ev.target.value); render(); return; }
    });

    document.addEventListener("input", function (ev) {
      const el = ev.target, d = el.dataset;

      if (d.num) {
        if (el.value === "") delete state.values[d.num]; else state.values[d.num] = el.value;
        renderInspector(); renderRail(); return;
      }
      if (d.text) {
        if (el.value === "") delete state.values[d.text]; else state.values[d.text] = el.value;
        renderInspector(); renderRail(); return;
      }
      if (d.buscartipo) {
        state.buscarTipo = el.value;
        const pos = el.selectionStart, cual = d.buscartipo;
        render();
        const otra = document.querySelector('[data-buscartipo="' + cual + '"]');
        if (otra) { otra.focus(); try { otra.setSelectionRange(pos, pos); } catch (e) { } }
        return;
      }
      if (d.combo) {
        state.comboOpen = d.combo; state.comboQuery = el.value;
        const pos = el.selectionStart;
        render();
        const again = document.querySelector('[data-combo="' + d.combo + '"]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { } }
        return;
      }
    });

    document.addEventListener("focusin", function (ev) {
      const d = ev.target.dataset;
      if (d && d.combo && state.comboOpen !== d.combo) {
        state.comboOpen = d.combo; state.comboQuery = "";
        render();
        const again = document.querySelector('[data-combo="' + d.combo + '"]');
        if (again) again.focus();
      }
    });

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && state.comboOpen) { state.comboOpen = null; state.comboQuery = ""; render(); }
    });

    $("#themeBtn").addEventListener("click", function () {
      const root = document.documentElement;
      const now = root.getAttribute("data-theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const current = now || (prefersDark ? "dark" : "light");
      root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
      render();
    });

    applyDefaults();
    render();

    // ¿está servido por servidor.py? Si sí, se puede guardar en el archivo.
    if (typeof fetch === "function") {
      fetch("api/ping").then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        if (d && d.ok) { state.servidor = true; render(); }
      }).catch(function () { /* abierto como archivo: modo solo lectura */ });
    }

    // avisar si se cierra con cambios sin guardar
    window.addEventListener("beforeunload", function (ev) {
      if (state.sucio && state.servidor) { ev.preventDefault(); ev.returnValue = ""; }
    });
  </script>

</body>
