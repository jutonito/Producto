<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de producto — captura</title>
  <style>
    :root {
      --ground: #EDF0F5;
      --surface: #FFFFFF;
      --surface-2: #F5F7FA;
      --surface-3: #E9EDF3;
      --line: #D3DAE4;
      --line-soft: #E3E8EF;
      --ink: #151A23;
      --ink-2: #414B5B;
      --ink-3: #67717F;
      --k-cat: #166149;
      --k-attr: #2C46A0;
      --k-field: #8A6110;
      --k-entity: #55637D;
      --k-drop: #9C3C33;
      --accent: #2C46A0;
      --accent-ink: #1E3277;
      --accent-soft: #E6EBFA;
      --accent-line: #B6C3E8;
      --thread: #9C6E11;
      --thread-ink: #7A5509;
      --thread-soft: #FAF0D6;
      --thread-line: #E2C983;
      --ok: #1C7256;
      --ok-soft: #E2F1EB;
      --crit: #A9433A;
      --crit-soft: #FBE9E7;
      --on-accent: #FFFFFF;
      --shadow: 0 1px 2px rgba(21, 26, 35, .06), 0 4px 14px rgba(21, 26, 35, .05);
      --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, "Roboto Mono", monospace;
      --r: 6px;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --ground: #0D1118;
        --surface: #161C26;
        --surface-2: #1C2430;
        --surface-3: #232C3A;
        --line: #2C3644;
        --line-soft: #222B37;
        --ink: #E7ECF3;
        --ink-2: #B2BDCC;
        --ink-3: #8A97AA;
        --k-cat: #4FBF97;
        --k-attr: #8BA2F1;
        --k-field: #E0B252;
        --k-entity: #9AA9C2;
        --k-drop: #E88D85;
        --accent: #8BA2F1;
        --accent-ink: #B9C7FA;
        --accent-soft: #1A2440;
        --accent-line: #39477A;
        --thread: #D6A63E;
        --thread-ink: #EBC97A;
        --thread-soft: #2A2313;
        --thread-line: #5A4718;
        --ok: #4FBF97;
        --ok-soft: #16302A;
        --crit: #E08078;
        --crit-soft: #2E1A18;
        --on-accent: #0D1118;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .28);
      }
    }

    :root[data-theme="dark"] {
      --ground: #0D1118;
      --surface: #161C26;
      --surface-2: #1C2430;
      --surface-3: #232C3A;
      --line: #2C3644;
      --line-soft: #222B37;
      --ink: #E7ECF3;
      --ink-2: #A5B0C1;
      --ink-3: #717E91;
      --accent: #8BA2F1;
      --accent-ink: #B9C7FA;
      --accent-soft: #1A2440;
      --accent-line: #39477A;
      --thread: #D6A63E;
      --thread-ink: #EBC97A;
      --thread-soft: #2A2313;
      --thread-line: #5A4718;
      --ok: #4FBF97;
      --ok-soft: #16302A;
      --crit: #E08078;
      --crit-soft: #2E1A18;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .28);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--display);
      margin: 0;
      text-wrap: balance;
      letter-spacing: -.011em
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--ink-3);
    }

    /* ---------- shell ---------- */
    .bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      height: 56px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0
    }

    .brand strong {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em
    }

    .brand span {
      font-size: 11.5px;
      color: var(--ink-3)
    }

    .spacer {
      flex: 1
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      height: 32px;
      min-width: 32px;
      padding: 0 9px;
      cursor: pointer;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .icon-btn:hover {
      border-color: var(--accent-line);
      color: var(--ink)
    }

    main {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 330px;
      align-items: start;
      gap: 0;
      min-height: calc(100vh - 56px);
    }

    .rail {
      border-right: 1px solid var(--line);
      background: var(--surface);
      padding: 16px 14px 40px;
      position: sticky;
      top: 56px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
    }

    .stage {
      padding: 22px 26px 72px;
      min-width: 0
    }

    .inspector {
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 16px 16px 40px;
      position: sticky;
      top: 56px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
    }

    @media (max-width:1240px) {
      main {
        grid-template-columns: 230px minmax(0, 1fr)
      }

      .inspector {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
        border-left: 0;
        border-top: 1px solid var(--line)
      }
    }

    @media (max-width:820px) {
      main {
        grid-template-columns: minmax(0, 1fr)
      }

      .rail {
        position: static;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .stage {
        padding: 18px 16px 60px
      }

      .bar {
        gap: 10px;
        padding: 0 12px
      }

      .brand span {
        display: none
      }
    }

    /* ---------- rail ---------- */
    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .dept {
      margin-top: 16px
    }

    .dept:first-of-type {
      margin-top: 4px
    }

    .dept>.eyebrow {
      display: block;
      margin-bottom: 7px
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .cat {
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: var(--r);
      padding: 7px 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cat:hover {
      background: var(--surface-2);
      border-color: var(--line-soft)
    }

    .cat[aria-current="true"] {
      background: var(--accent-soft);
      border-color: var(--accent-line)
    }

    .cat[aria-current="true"] .cat-name {
      color: var(--accent-ink);
      font-weight: 650
    }

    .cat-name {
      font-size: 13px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cat-code {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums
    }

    .jump {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-top: 6px
    }

    .jump a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 4px;
      text-decoration: none;
      color: var(--ink-2);
      font-size: 12.5px;
      border-left: 2px solid transparent;
    }

    .jump a:hover {
      background: var(--surface-2);
      color: var(--ink)
    }

    .jump .n {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-3)
    }

    .jump .miss {
      color: var(--crit);
      font-weight: 600
    }

    /* ---------- stage ---------- */
    .stage-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .stage-head h1 {
      font-size: 23px;
      font-weight: 660;
      letter-spacing: -.024em
    }

    .stage-head p {
      margin: 5px 0 0;
      color: var(--ink-2);
      font-size: 13px;
      max-width: 62ch
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill.req {
      background: var(--crit-soft);
      color: var(--crit);
      border-color: var(--crit)
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok)
    }

    .pill.mut {
      background: var(--surface-2);
      color: var(--ink-2);
      border-color: var(--line)
    }

    .pill.acc {
      background: var(--accent-soft);
      color: var(--accent-ink);
      border-color: var(--accent-line)
    }

    .pill.thr {
      background: var(--thread-soft);
      color: var(--thread-ink);
      border-color: var(--thread-line)
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow)
    }

    .group {
      margin-bottom: 14px;
      scroll-margin-top: 70px
    }

    .group-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line-soft);
    }

    .group-head h2 {
      font-size: 13.5px;
      font-weight: 650
    }

    .group-head .n {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3)
    }

    .group-body {
      padding: 4px 15px 15px;
      display: flex;
      flex-direction: column
    }

    .field {
      padding: 13px 0;
      border-bottom: 1px dashed var(--line-soft)
    }

    .field:last-child {
      border-bottom: 0;
      padding-bottom: 2px
    }

    .field-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .field-head label {
      font-size: 12.5px;
      font-weight: 620
    }

    .field-head .code {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-3)
    }

    .field-head .star {
      color: var(--crit);
      font-weight: 700
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--ink-3);
      margin: -3px 0 8px
    }

    .field.dep {
      border-left: 2px solid var(--accent-line);
      padding-left: 11px;
      margin-left: -13px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 100px;
      padding: 5px 12px;
      font-size: 12.5px;
      cursor: pointer;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--accent-line);
      color: var(--ink)
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600
    }

    .chip:disabled {
      opacity: .42;
      cursor: not-allowed
    }

    .chip .x {
      margin-left: 5px;
      opacity: .7
    }

    select.input,
    input.input {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 7px 10px;
      font-size: 13px;
      width: 100%;
      max-width: 380px;
    }

    select.input:hover,
    input.input:hover {
      border-color: var(--accent-line)
    }

    .num-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .num-wrap input.input {
      width: 120px
    }

    .unit {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink-3)
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer
    }

    .switch .track {
      width: 36px;
      height: 20px;
      border-radius: 100px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      position: relative;
      transition: background .15s, border-color .15s;
    }

    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 100px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
      transition: transform .15s;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0
    }

    .switch input:checked+.track {
      background: var(--accent);
      border-color: var(--accent)
    }

    .switch input:checked+.track::after {
      transform: translateX(16px)
    }

    .switch input:focus-visible+.track {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .switch .lbl {
      font-size: 12.5px;
      color: var(--ink-2)
    }

    .combo {
      position: relative;
      max-width: 380px
    }

    .combo-list {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 230px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 4px;
    }

    .combo-list button {
      display: flex;
      width: 100%;
      text-align: left;
      gap: 8px;
      align-items: center;
      background: none;
      border: 0;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12.5px;
    }

    .combo-list button:hover {
      background: var(--accent-soft)
    }

    .combo-empty {
      padding: 8px;
      font-size: 12px;
      color: var(--ink-3)
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      padding: 44px 32px;
      border: 1px dashed var(--line);
      border-radius: var(--r);
      background: var(--surface);
      max-width: 70ch;
    }

    .empty h2 {
      font-size: 18px;
      font-weight: 640
    }

    .empty p {
      margin: 0;
      color: var(--ink-2);
      max-width: 60ch
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
      gap: 9px
    }

    .cat-tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 96px;
    }

    .cat-tile:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow)
    }

    .cat-tile .t {
      font-size: 13.5px;
      font-weight: 640
    }

    .cat-tile .d {
      font-size: 11.5px;
      color: var(--ink-3);
      margin-top: -4px
    }

    .cat-tile .legacy {
      margin-top: auto;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--ink-3);
      line-height: 1.45;
      word-break: break-word;
    }

    .cat-tile .legacy b {
      color: var(--ink-2);
      font-weight: 600
    }

    /* ---------- inspector ---------- */
    .insp-sec {
      margin-bottom: 20px
    }

    .insp-sec>.eyebrow {
      display: block;
      margin-bottom: 8px
    }

    .meter {
      height: 6px;
      border-radius: 100px;
      background: var(--surface-3);
      overflow: hidden;
      margin: 8px 0 6px
    }

    .meter i {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width .25s
    }

    .meter i[data-full="true"] {
      background: var(--ok)
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px dashed var(--line-soft);
      font-size: 12.5px
    }

    .stat-row:last-child {
      border-bottom: 0
    }

    .stat-row span {
      color: var(--ink-2)
    }

    .stat-row b {
      font-family: var(--mono);
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    /* ---------- utilidades ---------- */
    .pad {
      padding: 15px
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 9px;
      font-size: 11.5px;
      cursor: pointer;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent-line);
      color: var(--ink)
    }

    /* de qué tabla sale hoy el campo: es la mitad del argumento de la migración */
    .src-tag {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .01em;
      color: var(--ink-3);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 1px 5px;
      white-space: nowrap;
    }

    .field-head .src-tag {
      margin-left: auto;
      cursor: help
    }

    .rail-head .src-tag {
      font-size: 9px
    }

    /* dónde se queda la característica: campo tipo_N, Apariencia o tabla propia */
    .src-tag.c-tipo {
      color: var(--accent-ink);
      border-color: var(--accent-line);
      background: var(--accent-soft)
    }

    .src-tag.c-apar {
      color: var(--thread-ink);
      border-color: var(--thread-line);
      background: var(--thread-soft)
    }

    .src-tag.c-tabla {
      color: var(--k-cat);
      border-color: var(--k-cat)
    }

    .src-tag b {
      font-weight: 700
    }

    .leyenda {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--ink-2);
    }

    .leyenda .src-tag {
      margin-right: 4px
    }

    /* tabla del mapa de campos */
    .scroll-x {
      overflow-x: auto
    }

    .tabla {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    .tabla th {
      text-align: left;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--ink-3);
      font-weight: 500;
      padding: 0 10px 7px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .tabla td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: middle
    }

    .tabla tr:last-child td {
      border-bottom: 0
    }

    .tabla tbody tr:hover {
      background: var(--surface-2)
    }

    .tabla .nm {
      font-weight: 600
    }

    .tabla .cd {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-3)
    }

    .tabla td.c {
      text-align: center;
      width: 1%;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums
    }

    .tabla tr.grp td {
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-3);
      padding: 6px 10px;
    }

    .hallazgos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 11px;
      margin-top: 14px
    }

    .hallazgos div {
      border-left: 2px solid var(--thread-line);
      padding: 2px 0 2px 11px
    }

    .hallazgos b {
      display: block;
      font-size: 12.5px;
      font-weight: 650;
      margin-bottom: 3px
    }

    .hallazgos span {
      font-size: 11.5px;
      color: var(--ink-2);
      line-height: 1.5
    }

    /* ---------- depuración de campos ---------- */
    .card.edicion {
      border-color: var(--thread-line);
      box-shadow: none
    }

    .card.edicion>.group-head {
      background: var(--thread-soft);
      border-bottom-color: var(--thread-line)
    }

    .card.edicion>.group-head h2,
    .card.edicion>.group-head .n {
      color: var(--thread-ink)
    }

    .field.extra {
      border-left: 2px solid var(--thread-line);
      padding-left: 11px;
      margin-left: -13px
    }

    .btn.quitar {
      margin-left: 8px;
      color: var(--crit);
      border-color: var(--crit-soft)
    }

    .btn.quitar:hover {
      border-color: var(--crit);
      background: var(--crit-soft);
      color: var(--crit)
    }

    .field-head .src-tag+.btn.quitar {
      margin-left: 8px
    }

    .cambios {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px
    }

    .cambios .eyebrow {
      display: block;
      margin-bottom: 5px
    }

    .chip .mas {
      margin-left: 5px;
      color: var(--ok);
      font-weight: 700
    }

    .alerta {
      background: var(--crit-soft);
      border: 1px solid var(--crit);
      color: var(--ink);
      border-radius: var(--r);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .guardar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .guardar .btn {
      padding: 7px 14px;
      font-size: 12.5px
    }

    .guardar .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .guardar .cd {
      font-size: 11.5px;
      color: var(--ink-3);
      max-width: 62ch;
      line-height: 1.5
    }

    .alcance {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--line);
    }

    .ord-group {
      display: inline-flex;
      gap: 4px
    }

    .ord-group .ord {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink-2);
      border-radius: var(--r);
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .ord-group .ord:hover {
      border-color: var(--accent-line);
      color: var(--ink)
    }

    .ord-group .ord[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600
    }

    .alcance .eyebrow {
      margin-right: -4px
    }

    .alcance .btn.quitar {
      margin-left: auto
    }

    .cambios .cd {
      display: block;
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 5px
    }

    /* valores de un campo, para darlos de baja */
    .valores {
      margin-top: 10px;
      padding: 9px 11px;
      border: 1px dashed var(--thread-line);
      border-radius: var(--r);
      background: var(--thread-soft);
    }

    .valores .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: var(--thread-ink)
    }

    .valores .chip {
      background: var(--surface);
      font-size: 11.5px;
      padding: 3px 9px
    }

    .valores .chip:hover {
      border-color: var(--crit);
      color: var(--crit)
    }

    .chip.fuera {
      opacity: .75;
      text-decoration: line-through;
      border-style: dashed
    }

    .chip.fuera:hover {
      opacity: 1;
      text-decoration: none;
      border-color: var(--ok);
      color: var(--ok)
    }

    /* selector del campo donde se guarda la característica */
    .sel-campo {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .sel-campo select {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 4px;
      border: 1px solid var(--accent-line);
      border-radius: 3px;
      background: var(--surface);
      color: var(--accent-ink);
      cursor: pointer;
    }

    .sel-campo select:hover {
      border-color: var(--accent)
    }

    .sel-campo.cambiado select {
      border-color: var(--thread);
      color: var(--thread-ink);
      background: var(--thread-soft);
      font-weight: 700
    }

    .sel-campo .btn {
      padding: 1px 6px;
      font-size: 11px;
      line-height: 1.4
    }

    .src-tag.cambiado {
      border-color: var(--thread);
      color: var(--thread-ink);
      background: var(--thread-soft);
      font-weight: 700
    }

    /* campo que el sistema llena solo: se muestra el valor, no un control */
    .auto-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 9px 12px;
      max-width: 380px;
    }

    .auto-box b {
      font-size: 13.5px;
      font-weight: 650
    }

    .auto-box .from {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-3)
    }

    .pill.auto {
      background: var(--thread-soft);
      color: var(--thread-ink);
      border-color: var(--thread-line)
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important
      }
    }

    html {
      scroll-behavior: smooth
    }
  </style>
</head>

    function repartoCampos(bs) {

        const c = campoDe(b.code);
        if (!c) return;

    /* -------------------------------------------------------------------------

    const state = {

    // ids estables para cada valor
    Object.keys(ATTRS).forEach(function (code) {
      const at = ATTRS[code];
      at.code = code;
      (at.values || []).forEach(function (val, i) { val.id = code + "_" + i; });
    });
    // resolver merge -> id destino
    Object.keys(ATTRS).forEach(function (code) {
      (ATTRS[code].values || []).forEach(function (val) {
        if (val.merge) {
          const t = ATTRS[code].values.find(function (x) { return x.l === val.merge; });
          val.mergedInto = t ? t.id : null;
        }
      });
    });

    const $ = function (s) { return document.querySelector(s); };
    const esc = function (s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    };

    /* ---------- lógica de esquema ---------- */

    function catById(id) { return CATS.find(function (c) { return c.id === id; }); }

    // bindings efectivos de una categoría = globales + propios (excluye los apagados por admin)
    function bindings(cat) {
      if (!cat) return [];
      const own = cat.attrs.filter(function (b) { return !b.off; });
      return GLOBAL_ATTRS.filter(function (b) { return !b.off; }).concat(own);
    }

    /* ---------- depuración: dos alcances, general y por tipo de prenda ---------- */

    function edicionDe(clave) {
      const e = EDICIONES[clave] || {};
      return {
        quitar: e.quitar || [], agregar: e.agregar || [],
        valores: e.valores || {}, tipos: e.tipos || [], campos: e.campos || {}
      };
    }

    function bolsa(clave) {                       // la crea si no existe
      const e = EDICIONES[clave] || (EDICIONES[clave] = {});
      e.quitar = e.quitar || [];
      e.agregar = e.agregar || [];
      e.valores = e.valores || {};
      if (clave === GEN) { e.tipos = e.tipos || []; e.campos = e.campos || {}; }
      return e;
    }

    function limpiar(clave) {                     // borra la entrada si quedó vacía
      const e = EDICIONES[clave];
      if (!e) return;
      Object.keys(e.valores || {}).forEach(function (c) {
        if (!e.valores[c].length) delete e.valores[c];
      });
      const vacia = !(e.quitar || []).length && !(e.agregar || []).length &&
        !Object.keys(e.valores || {}).length && !(e.tipos || []).length &&
        !Object.keys(e.campos || {}).length;
      if (vacia) delete EDICIONES[clave];
    }

    /* ---------- reasignar el campo de una característica ----------
       Va siempre en el alcance general: una característica se guarda en el
       mismo campo en todas las prendas. */

    const DESTINOS = ["tipo_1", "tipo_2", "tipo_3", "tipo_4", "tipo_5", "tipo_6",
      "Apariencia", "AFamilia", "referencias_gru", "referencias_Subgru",
      "referencias_Subgru2", "referencias_Subgru3"];

    function claseDe(destino) {
      if (destino.indexOf("tipo_") === 0) return "tipo";
      if (destino.indexOf("referencias") === 0) return "tabla";
      return "apar";
    }

    // el campo vigente de una característica: el calculado, salvo que se haya
    // cambiado a mano desde la pantalla
    function campoDe(code) {
      const base = CAMPO[code];
      if (!base) return null;
      const ov = edicionDe(GEN).campos[code];
      if (!ov || ov === base[0]) return base;
      return [ov, claseDe(ov), base[2], base[3], base[4],
        "Cambiado a mano desde la pantalla. El cruce lo había asignado a " + base[0] + ": " + base[5]];
    }

    function campoCambiado(code) {
      const ov = edicionDe(GEN).campos[code];
      return !!(ov && CAMPO[code] && ov !== CAMPO[code][0]);
    }

    function reasignarCampo(code, destino) {
      const e = bolsa(GEN);
      if (!destino || (CAMPO[code] && destino === CAMPO[code][0])) delete e.campos[code];
      else e.campos[code] = destino;
      limpiar(GEN);
      state.sucio = true;
      state.aviso = "";
    }

    function ocupacion() {
      const m = {};
      ["tipo_1", "tipo_2", "tipo_3", "tipo_4", "tipo_5", "tipo_6"].forEach(function (f) { m[f] = []; });
      Object.keys(ATTRS).forEach(function (code) {
        const c = campoDe(code);
        if (!c || c[1] !== "tipo") return;
        (m[c[0]] = m[c[0]] || []).push([code, c[2]]);
      });
      return Object.keys(m).map(function (f) {
        return [f, m[f].sort(function (x, y) { return y[1] - x[1]; })];
      });
    }

    function quita(lista, x) {                    // saca x de la lista; ¿estaba?
      const i = lista.indexOf(x);
      if (i !== -1) { lista.splice(i, 1); return true; }
      return false;
    }

    // los campos de una ficha = los de su categoría, menos lo quitado en general
    // y en esa prenda, más lo que se le agregó a mano
    function bindingsTipo(tipoName, cat) {
      const base = bindings(cat);
      const gen = edicionDe(GEN);
      const ed = tipoName ? edicionDe(tipoName) : { quitar: [], agregar: [] };
      if (!gen.quitar.length && !ed.quitar.length && !ed.agregar.length) return base;
      const out = base.filter(function (b) {
        return gen.quitar.indexOf(b.code) === -1 && ed.quitar.indexOf(b.code) === -1;
      });
      ed.agregar.forEach(function (code) {
        if (!ATTRS[code]) return;
        if (out.some(function (b) { return b.code === code; })) return;
        out.push(a(code, { extra: 1 }));
      });
      return out;
    }

    /* ---------- valores dados de baja ---------- */

    function valorQuitado(code, valId, tipoName) {
      const gen = edicionDe(GEN).valores[code] || [];
      if (gen.indexOf(valId) !== -1) return "general";
      if (tipoName) {
        const p = edicionDe(tipoName).valores[code] || [];
        if (p.indexOf(valId) !== -1) return "prenda";
      }
      return null;
    }

    // valores del catálogo que se dieron de baja para este campo
    function valoresQuitados(code, tipoName) {
      const at = ATTRS[code];
      if (!at || !at.values) return [];
      return at.values.map(function (v) {
        const d = valorQuitado(code, v.id, tipoName);
        return d ? { id: v.id, l: v.l, alcance: d } : null;
      }).filter(Boolean);
    }

    // quitar o restaurar un valor, en el alcance activo
    function editarValor(code, valId, quitarlo) {
      const clave = state.alcance === "general" ? GEN : state.tipo;
      if (!clave) return;
      if (quitarlo) {
        const e = bolsa(clave);
        const lista = e.valores[code] || (e.valores[code] = []);
        if (lista.indexOf(valId) === -1) lista.push(valId);
        const cur = state.values[code];             // sacarlo de lo ya elegido
        if (Array.isArray(cur)) {
          const next = cur.filter(function (x) { return x !== valId; });
          if (next.length) state.values[code] = next; else delete state.values[code];
        } else if (cur === valId) delete state.values[code];
      } else {
        [GEN, state.tipo].forEach(function (k) {     // restaurar donde esté
          if (!k || !EDICIONES[k] || !EDICIONES[k].valores) return;
          quita(EDICIONES[k].valores[code] || [], valId);
          limpiar(k);
        });
      }
      limpiar(clave);
      state.sucio = true;
      state.aviso = "";
    }

    /* ---------- tipos de prenda dados de baja ---------- */

    function tipoQuitado(t) { return edicionDe(GEN).tipos.indexOf(t) !== -1; }
    function tiposVivos() { return TIPOS.filter(function (x) { return !tipoQuitado(x.t); }); }

    function editarTipo(t, quitarlo) {
      const e = bolsa(GEN);
      if (quitarlo) {
        if (e.tipos.indexOf(t) === -1) e.tipos.push(t);
        if (state.tipo === t) { state.tipo = null; state.cat = null; state.values = {}; }
      } else {
        quita(e.tipos, t);
      }
      limpiar(GEN);
      state.sucio = true;
      state.aviso = "";
    }

    function nCambios(clave) {
      const ed = edicionDe(clave);
      return ed.quitar.length + ed.agregar.length + ed.tipos.length + Object.keys(ed.campos).length +
        Object.keys(ed.valores).reduce(function (s, c) { return s + ed.valores[c].length; }, 0);
    }

    function totalCambios() {
      return Object.keys(EDICIONES).reduce(function (s, t) { return s + nCambios(t); }, 0);
    }

    // quitar / agregar un campo, en el alcance activo
    function editarCampo(code, quitar) {
      const clave = state.alcance === "general" ? GEN : state.tipo;
      if (!clave) return;
      const e = bolsa(clave);
      if (quitar) {
        // si estaba agregado a mano en esta prenda, quitarlo es deshacer eso
        if (!quita(e.agregar, code)) {
          if (e.quitar.indexOf(code) === -1) e.quitar.push(code);
        }
        delete state.values[code];
      } else {
        // restaurar: puede estar quitado en general y/o en la prenda
        let habia = quita(e.quitar, code);
        if (clave !== GEN && EDICIONES[GEN]) {
          habia = quita(EDICIONES[GEN].quitar || [], code) || habia;
          limpiar(GEN);
        }
        if (!habia && e.agregar.indexOf(code) === -1) e.agregar.push(code);
      }
      limpiar(clave);
      state.sucio = true;
      state.aviso = "";
    }

    // ¿la ficha quedó con dos campos en la misma columna de tipo?
    function conflictosDe(bs) {
      const porCampo = {};
      bs.forEach(function (b) {
        const c = campoDe(b.code);
        if (!c || c[1] !== "tipo") return;
        (porCampo[c[0]] = porCampo[c[0]] || []).push(ATTRS[b.code].label);
      });
      return Object.keys(porCampo).filter(function (f) { return porCampo[f].length > 1; })
        .map(function (f) { return { campo: f, campos: porCampo[f] }; });
    }

    // tipoName: nombre del tipo de prenda para acotar los valores con alcance propio
    // (las líneas de tipo_6 vienen marcadas por prenda en PlantillaTipos).
    // Pasar null desestima ese filtro y devuelve la unión.
    function activeValues(code, catId, tipoName) {
      const at = ATTRS[code];
      if (!at.values) return [];
      const t = tipoName === undefined ? state.tipo : tipoName;
      return at.values.filter(function (val) {
        if (val.off || val.mergedInto) return false;
        if (valorQuitado(code, val.id, t)) return false;      // dado de baja a mano
        if (val.cats && catId && val.cats.indexOf(catId) === -1) return false;
        if (val.tipos && t && val.tipos.indexOf(t) === -1) return false;
        return true;
      });
    }

    // Cuántas líneas del extracto quedan inservibles para un tipo de prenda:
    // NO APLICA y las que vienen sin descripción.
    function lineasInservibles(tipoName) {
      return (ATTRS.linea.values || []).filter(function (val) {
        return val.off && val.tipos && val.tipos.indexOf(tipoName) !== -1;
      });
    }

    function labelOf(code, id) {
      const at = ATTRS[code];
      if (!at.values) return String(id);
      const found = at.values.find(function (x) { return x.id === id; });
      return found ? found.l : String(id);
    }

    function selectedLabels(code) {
      const raw = state.values[code];
      if (raw == null) return [];
      if (Array.isArray(raw)) return raw.map(function (id) { return labelOf(code, id); });
      return [labelOf(code, raw)];
    }

    // ¿el atributo se muestra? (reglas de dependencia)
    function visible(code) {
      const rule = ATTRS[code].showIf;
      if (!rule) return true;
      const labels = selectedLabels(rule.attr);
      if (rule.hasAny) return rule.hasAny.some(function (l) { return labels.indexOf(l) !== -1; });
      if (rule.in) return labels.some(function (l) { return rule.in.indexOf(l) !== -1; });
      if (rule.notIn) return labels.length > 0 && labels.every(function (l) { return rule.notIn.indexOf(l) === -1; });
      return true;
    }

    function isMulti(b) { return ATTRS[b.code].input === "multi"; }

    function isFilled(b) {
      const raw = state.values[b.code];
      if (Array.isArray(raw)) return raw.length > 0;
      if (typeof raw === "boolean") return true;
      return raw !== undefined && raw !== null && raw !== "";
    }

    function visibleBindings() {
      return bindingsTipo(state.tipo, catById(state.cat)).filter(function (b) { return visible(b.code); });
    }

    function requiredStats() {
      const vis = visibleBindings();
      const req = vis.filter(function (b) { return b.req; });
      const done = req.filter(isFilled);
      return { total: req.length, done: done.length, missing: req.filter(function (b) { return !isFilled(b); }) };
    }

    function totalAttrsInRegistry() { return Object.keys(ATTRS).length; }

    const NUM = function (n) {
      return n.toLocaleString("es-CO", { maximumFractionDigits: 0 });

    const VOL_TOTAL = VOLUMEN.reduce(function (s, r) { return s + r[1]; }, 0);

    /* -------------------------------------------------------------------------
       La taxonomía la manda el extracto, no al revés.
       De VOLUMEN se deriva, para cada categoría:
         · fromTipos — los tipos de prenda reales que la alimentan, con su volumen
         · vol       — sus referencias creadas desde 2025
         · dept      — la agrupación del extracto que más volumen le aporta
       y las categorías se ordenan por uso real. Nada de esto se escribe a mano:
       si el extracto cambia, la agrupación y el orden cambian con él.
       ------------------------------------------------------------------------- */
    (function derivarTaxonomia() {
      const agg = {};
      VOLUMEN.forEach(function (r) {
        if (!r[3]) return;                       // sin categoría destino todavía, no agrupa nada
        const x = agg[r[3]] || (agg[r[3]] = { n: 0, tipos: [], grupos: {} });
        x.n += r[1];
        x.tipos.push({ t: r[0], n: r[1] });
        x.grupos[r[2]] = (x.grupos[r[2]] || 0) + r[1];
      });
      CATS.forEach(function (c) {
        const x = agg[c.id];
        c.vol = x ? x.n : 0;
        c.fromTipos = x ? x.tipos.sort(function (a, b) { return b.n - a.n; }) : [];
        c.dept = x
          ? Object.keys(x.grupos).sort(function (a, b) { return x.grupos[b] - x.grupos[a]; })[0]
          : "SIN RESPALDO EN EL EXTRACTO";
      });
      CATS.sort(function (a, b) { return b.vol - a.vol; });
    })();

    const TIPOS = VOLUMEN.map(function (r) {
      return { t: r[0], n: r[1], grupo: r[2], cat: r[3], nota: r[4] };
    }).sort(function (a, b) { return b.n - a.n; });

    // La colección sale de la fecha de creación: primer semestre -> Enero,
    // segundo -> Julio. Es lo que hoy hace tipo_5, pero con temporada y año
    // explícitos en vez de un timestamp suelto.
    function coleccionAuto(d) {
      const f = d || new Date();
      const sem = f.getMonth() < 6 ? 1 : 2;
      return f.getFullYear() + "-" + sem + " · " + (sem === 1 ? "Enero" : "Julio");
    }

    function fechaHoy() {
      const f = new Date();
      return String(f.getDate()).padStart(2, "0") + "/" +
        String(f.getMonth() + 1).padStart(2, "0") + "/" + f.getFullYear();
    }

    // Rellena los campos automáticos y los que traen un valor por defecto.
    // Se llama al arrancar, al elegir tipo de prenda y al vaciar el formulario.
    function applyDefaults() {
      Object.keys(ATTRS).forEach(function (code) {
        const at = ATTRS[code];
        if (at.input === "auto") { state.values[code] = at.auto(); return; }
        if (at.def && state.values[code] === undefined) {
          const val = (at.values || []).find(function (x) { return x.l === at.def; });
          if (val) state.values[code] = val.id;
        }
      });
    }

      Object.keys(porGrupo).sort(function (a, b) {

      }).forEach(function (g) {
        html += '<div class="dept"><span class="eyebrow">' + esc(g) + '</span><div class="cat-list">';

          const on = state.tipo === x.t;
          html += '<button type="button" class="cat" data-tipo="' + esc(x.t) + '" aria-current="' + on + '">' +

            '<span class="cat-code">' + NUM(x.n) + '</span>' +
            '</button>';
        });
        html += '</div></div>';

      if (state.cat) {
        const cat = catById(state.cat);
        const vis = visibleBindings();
        html += '<div class="dept"><span class="eyebrow">Secciones activas</span><nav class="jump">';

          const inG = vis.filter(function (b) { return ATTRS[b.code].g === g[0]; });

      }
      rail.innerHTML = html;

    function fieldControl(b) {
      const at = ATTRS[b.code];
      const code = b.code;
      const raw = state.values[code];

      if (at.input === "bool") {

      // campo automático: el sistema ya lo resolvió, no hay nada que preguntar

      // listas largas de selección única -> buscador tipo combobox
      if (vals.length > 12 && at.input === "single") {
        const open = state.comboOpen === code;
